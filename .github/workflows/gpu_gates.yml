name: GPU Gates
# Per-commit regression lattice on the self-hosted GPU runner: md5
# fingerprints (bit-identity), plan-flip equality, metric floors, perf gate.
# The runner box's GPU is SHARED with training jobs -- the gpu_guard step
# waits for a sustained idle window and fails distinctly ("GPU busy") if none
# appears within its timeout; rerun the workflow later in that case.

on:
  push:
    branches:
      - master
    # Docs-only commits cannot move a fingerprint or a timing, and this box is
    # a shared dev machine -- running the GPU suite for a README edit only
    # burns the GPU and mails noise.
    paths:
      - "src/**"
      - "include/**"
      - "python-package/**"
      - "tests/gates/**"
      - "CMakeLists.txt"
      - ".github/workflows/gpu_gates.yml"
  pull_request:
  workflow_dispatch:

concurrency:
  # A push train should leave ONE run, on the newest commit: superseded runs
  # are cancelled instead of queueing behind each other on the single GPU.
  group: gpu-gates
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  gates:
    name: regression-lattice
    runs-on: [self-hosted, gpu]
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          submodules: true
      - name: Wait for GPU (shared with training jobs)
        run: python3 tests/gates/gpu_guard.py --require-free-mb 8000 --max-util 20 --timeout-min 45
      - name: Build CUDA wheel (ccache)
        run: bash tests/gates/ci_build.sh
      - name: Re-check GPU before running cells
        run: python3 tests/gates/gpu_guard.py --require-free-mb 8000 --max-util 20 --timeout-min 30
      - name: Lattice (md5 + equality + validity + metric gates)
        run: .gates-venv/bin/python tests/gates/lattice.py --check
      - name: FALB binary format (round-trip, loader robustness, python plumbing)
        run: |
          .gates-venv/bin/python tests/gates/falb_roundtrip.py
          .gates-venv/bin/python tests/gates/falb_python.py
      - name: Foreign-model import parity (XGBoost, CatBoost)
        run: |
          .gates-venv/bin/python tests/gates/import_xgboost.py
          .gates-venv/bin/python tests/gates/import_catboost.py
      - name: Selective-growth equivalence (vs classic leaf-wise)
        run: .gates-venv/bin/python tests/gates/selective_equivalence.py --seeds 8
      # Advisory on this box, never a failure: the GPU is shared with dev and
      # training work, so a timing here is a hint, not a verdict. The nightly
      # run gates on it for real, on a quieter machine state.
      - name: Perf gate (vs machine-local rolling baseline, advisory)
        continue-on-error: true
        run: .gates-venv/bin/python tests/gates/perf_gate.py --record
