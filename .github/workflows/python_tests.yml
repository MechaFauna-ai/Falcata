# The Python test suite on CPU. The CUDA half of the same suite runs in the
# local nightly (tests/gates/nightly_local.sh), because hosted runners have no
# GPU. Between the two, every test executes on both devices.
name: Python tests

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

# automatically cancel in-progress builds if another commit is pushed
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# default to 0 permissions
# (job-level overrides add the minimal permissions needed)
permissions:
  contents: read

jobs:
  python-tests-cpu:
    name: python-tests (cpu)
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          fetch-depth: 5
          persist-credentials: false
          submodules: true
      - name: Set up Python
        uses: actions/setup-python@e797f83a9d19a0b6b0b1d3adb3e37fe0ea9c7b53  # v6.0.0
        with:
          python-version: '3.12'
      - name: Build and install the CPU package
        shell: bash
        run: |
          python -m pip install --upgrade pip build
          sh ./build-python.sh sdist
          # USE_CUDA=OFF is what makes this the CPU half. pyproject defaults it
          # ON (Falcata is CUDA-native), and a hosted runner has no toolkit, so
          # the override is required rather than cosmetic. With no CUDA in the
          # build an unset device_type resolves to cpu, which is exactly the
          # configuration these tests were written against.
          python -m pip install -v \
            --config-settings=cmake.define.USE_CUDA=OFF \
            "$(echo ./dist/falcata-*.tar.gz)"
      - name: Install test dependencies
        shell: bash
        run: |
          python -m pip install \
            cloudpickle matplotlib pandas psutil pyarrow pytest pytest-timeout scikit-learn scipy
      - name: Run the Python test suite
        shell: bash
        run: |
          python -m pytest ./tests/python_package_test -ra --timeout=900
  all-python-tests-successful:
    if: always()
    runs-on: ubuntu-latest
    needs:
      - python-tests-cpu
    permissions:
      statuses: read
    steps:
      - name: Note that all tests succeeded
        uses: re-actors/alls-green@05ac9388f0aebcb5727afa17fcccfecd6f8ec5fe  # v1.2.2
        with:
          jobs: ${{ toJSON(needs) }}
