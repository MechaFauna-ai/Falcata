name: GPU Gates Nightly
# The tiers a 10-minute per-commit budget cannot cover:
#   - seeded config x shape fuzzer (validity + quant determinism + CPU parity);
#     failures print a repro spec to promote into tests/gates/fuzz_corpus.json
#   - FALCATA_VERIFY=1 sweep: every ingestion fast path self-verifies against
#     its reference implementation
# Big-shape overflow cells (11M-row class) and full-bench canonical gates are
# still run from the bench workspace; wiring them in here is a TODO.

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

concurrency:
  group: gpu-gates
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  nightly:
    name: fuzz-and-verify
    runs-on: [self-hosted, gpu]
    timeout-minutes: 240
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          submodules: true
          persist-credentials: false
      - name: Wait for GPU (shared with training jobs)
        run: python3 tests/gates/gpu_guard.py --require-free-mb 12000 --max-util 10 --timeout-min 120
      - name: Build CUDA wheel (ccache)
        run: bash tests/gates/ci_build.sh
      - name: Lattice with runtime self-verification (FALCATA_VERIFY=1)
        run: FALCATA_VERIFY=1 .gates-venv/bin/python tests/gates/lattice.py --check
      - name: Selective-growth equivalence (wide)
        run: .gates-venv/bin/python tests/gates/selective_equivalence.py --seeds 32 --rounds 30
      - name: Fuzz (seeded by date; corpus reruns first)
        run: .gates-venv/bin/python tests/gates/fuzz.py --minutes 45
      - name: Full-scale fixedpoint tree-emission gate (needs ~20GB free VRAM)
        run: |
          python3 tests/gates/gpu_guard.py --require-free-mb 20000 --max-util 10 --timeout-min 30
          .gates-venv/bin/python tests/gates/canonical.py numerai-treecount
      - name: Canonical md5 locks (full-scale bit-identity)
        run: .gates-venv/bin/python tests/gates/canonical.py all
      - name: Bench tier (real-dataset perf, 3-repeat medians, 4%/8% bands)
        run: |
          python3 tests/gates/gpu_guard.py --require-free-mb 12000 --max-util 10 --timeout-min 30
          .gates-venv/bin/python tests/gates/bench_tier.py --out tests/gates/bench_results.json
          .gates-venv/bin/python tests/gates/perf_gate.py --results tests/gates/bench_results.json \
            --baseline-file ~/.cache/falcata-gates/bench_baseline.json --warn-pct 4 --fail-pct 8 --record
