verbose = "info"
no_progress = false
cache = false
scheme = ["http", "https", "file"]
include_mail = false
include_fragments = true
no_ignore = true
insecure = false
require_https = true
accept = ["100..=103", "200..=299"]
user_agent = "curl/7.88.1"
header = {"User-Agent" = "curl/7.88.1"}
timeout = 30
retry_wait_time = 10
max_concurrency = 10
# remove anchors from GitHub URLs to overcome https://github.com/lycheeverse/lychee/issues/1729
remap = [
    '(?P<host>^https://github\.com)/(?P<path>.*)#(?P<anchor>.*)$ $host/$path/',
]
exclude = [
    # the pkgdown site is configured (pkgdown requires a canonical url) but not
    # published yet: every generated R cross-reference points at it. Drop this
    # entry once GitHub Pages serves the R docs.
    '^https://mechafauna-ai\.github\.io/Falcata/.*',
    '^https://www\.swig\.org/download\.html$',
    '^https://proceedings\.neurips\.cc/.*',
    '^https://www\.amd\.com/en/support\.html$',
    '^https://www\.jstor\.org/stable/2281952$',
    '^https://dl\.acm\.org/doi/10\.1145/3298689\.3347033$',
    '^https://packages\.ubuntu\.com/search.*',
    '^https://stackoverflow\.com/.*',
    '^https://.*\.stackexchange\.com/.*',
    # bot-blocks the checker (403) regardless of link health
    '^https://medium\.com/.*',
    # rate-limits the checker to 429 when a run has more than a couple of links
    '^https://en\.wikipedia\.org/.*',
]
exclude_path = [
    # vendored third-party docs (fmt, eigen, nanoarrow ...): not ours to fix,
    # and only reachable since the docs build began checking out submodules
    "(^|/)external_libs/",
]
