# Standalone perf-probe microbenchmarks use terse local names (nd = num_data)
# that trip the dictionary; they are not library source.
[files]
extend-exclude = ["benchmarks/construct_find_jit_probe/"]

[default]
extend-ignore-re = [
  "\\b[0-9a-f]{8,40}\\b",
  "/Ot",
  "mis-[a-z]+",
  "posix-seh-rt",
  # CUDA driver/runtime attribute enum (spelled "Optin" by NVIDIA):
  "cudaDevAttrMaxSharedMemoryPerBlockOptin",
]

[default.extend-words]
MAPE = "MAPE"
# threshold abbreviation (cat_thr, total_cat_thr, FALB array names, ROADMAP
# debug dumps)
thr = "thr"
datas = "datas"
indx = "indx"
interprete = "interprete"
mape = "mape"
splitted = "splitted"

[default.extend-identifiers]
ERRORs = "ERRORs"
# packed-accumulator type template parameter in the CUDA histogram kernels
PACKT = "PACKT"
GAM = "GAM"
ND24s = "ND24s"
WARNINGs = "WARNINGs"
fullset = "fullset"
thess = "thess"
