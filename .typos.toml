default.extend-ignore-re = [
  "\\b[0-9a-f]{8,40}\\b",
  "/Ot",
  "mis-alignment",
  "mis-spelled",
  "posix-seh-rt",
  # CUDA driver/runtime attribute enum (spelled "Optin" by NVIDIA):
  "cudaDevAttrMaxSharedMemoryPerBlockOptin",
]

[default.extend-words]
MAPE = "MAPE"
datas = "datas"
indx = "indx"
interprete = "interprete"
mape = "mape"
splitted = "splitted"

[default.extend-identifiers]
ERRORs = "ERRORs"
GAM = "GAM"
ND24s = "ND24s"
WARNINGs = "WARNINGs"
fullset = "fullset"
thess = "thess"
